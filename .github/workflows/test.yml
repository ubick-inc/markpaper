name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        # Temporarily testing only on macOS with Node 22
        os: [macos-latest]
        node-version: [22.x]
        # os: [ubuntu-latest, macos-latest, windows-latest]
        # node-version: [18.x, 20.x, 22.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build

    - name: Run unit tests
      run: npm run test:unit

    - name: Run E2E tests
      run: npm run test:e2e
      # E2E tests might be flaky on Windows, so we allow them to fail there
      continue-on-error: ${{ matrix.os == 'windows-latest' }}

    - name: Upload coverage reports
      if: matrix.os == 'macos-latest' && matrix.node-version == '22.x'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/

